name: A site came out wrong
description: Rows missing, wrong columns, stuck on a page, stopped early, or blocked
labels: ["site"]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      description: The page you asked it to collect. Leave out anything private (tokens, account ids).
    validations:
      required: true
  - type: textarea
    id: ask
    attributes:
      label: What you asked for
      description: Your request to the agent, in your own words.
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What you got
      description: Rows and columns in the CSV, the stop reason in the agent's report, and what was wrong or missing.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Bundled browser (default)
        - My own Chrome (--browser chrome)
        - Not sure
  - type: input
    id: agent
    attributes:
      label: Agent and model
      placeholder: e.g. Claude Code, Sonnet
